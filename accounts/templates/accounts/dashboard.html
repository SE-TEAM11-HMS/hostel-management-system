<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Dashboard | Hostel Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Hostel Management System</h1>

    <h2>Administrator Dashboard</h2>

    <p>
        Welcome, {{ request.user.username }}.
        You have successfully logged in.
    </p>

    <p>
        The administrator dashboard is active.
        Student management functionality will be connected
        as the remaining Sprint 1 tasks are implemented.
    </p>

    <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}

        <button type="submit">Logout</button>
    </form>
</body>
</html>
