
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Hostel Management System</title>
</head>
<body>
    <main>
        <h1>Student Portal</h1>
        <p>Sign in using your student account.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div>
                {{ form.username.label_tag }}
                {{ form.username }}
                {{ form.username.errors }}
            </div>

            <div>
                {{ form.password.label_tag }}
                {{ form.password }}
                {{ form.password.errors }}
            </div>

            <button type="submit">Student Login</button>
        </form>

        <p>
            Administrator?
            <a href="{% url 'accounts:login' %}">Administrator Login</a>
        </p>
    </main>
</body>
</html>
