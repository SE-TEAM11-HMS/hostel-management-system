<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allocate Room</title>
</head>
<body>
    <h1>Allocate Room to Student</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'allocations:allocate_room' %}">
        {% csrf_token %}

        <div>
            <label for="student_id">Select Student:</label>
            <select name="student_id" id="student_id" required>
                <option value="">-- Select Student --</option>
                {% for student in students %}
                    <option value="{{ student.id }}">
                        {{ student.usn }} - {{ student.name }}
                    </option>
                {% empty %}
                    <option value="" disabled>No eligible students available</option>
                {% endfor %}
            </select>
        </div>

        <br>

        <div>
            <label for="room_id">Select Available Room:</label>
            <select name="room_id" id="room_id" required>
                <option value="">-- Select Room --</option>
                {% for room in rooms %}
                    <option value="{{ room.id }}">
                        {{ room.hostel.name }} - Room {{ room.room_number }}
                        ({{ room.available_beds }} beds available)
                    </option>
                {% empty %}
                    <option value="" disabled>No available rooms</option>
                {% endfor %}
            </select>
        </div>

        <br>

        <button type="submit">Allocate Room</button>
    </form>
</body>
</html>
