name: Hostel Management System CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Django Tests and Code Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: hostel_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: github-actions-test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_NAME: hostel_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install MySQL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Check Django configuration
        run: python manage.py check

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run Django tests with branch coverage
        run: |
          coverage erase
          coverage run --branch manage.py test

      - name: Generate coverage reports
        if: always()
        run: |
          coverage report -m
          coverage json -o coverage.json
          coverage html -d htmlcov

      - name: Publish coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("coverage.json") as f:
              totals = json.load(f)["totals"]

          statement_pct = (
              100 * totals["covered_lines"] / totals["num_statements"]
              if totals["num_statements"] else 0
          )
          branch_pct = totals.get("percent_branches_covered", 0)

          print("## Hostel Management System - Code Coverage")
          print()
          print("| Metric | Result |")
          print("|---|---:|")
          print(f"| Statement coverage | {statement_pct:.2f}% |")
          print(f"| Branch coverage | {branch_pct:.2f}% |")
          print(f"| Statements covered | {totals['covered_lines']} / {totals['num_statements']} |")
          print(f"| Branches covered | {totals.get('covered_branches', 0)} / {totals.get('num_branches', 0)} |")
          PY

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostel-management-system-coverage-report
          path: |
            htmlcov/
            coverage.json
          if-no-files-found: warn
